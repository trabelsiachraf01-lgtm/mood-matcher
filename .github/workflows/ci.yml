name: CI

# Mirrors the pre-commit hook (.githooks/pre-commit), enforced server-side since local
# hooks aren't tracked by git and --no-verify can skip them. No API keys, no model
# downloads — just the fast, free checks. The integration tests (real API calls, real
# EBind weights) stay local/manual; see README.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.8
      - run: ruff check src/ tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
