[project]
name = "hushtone"
version = "0.2.0"
description = "Cross-modal mood-matching: an image, a song, or text in; a generated caption plus a real matched song/image out."
requires-python = ">=3.11"

[tool.ruff.lint]
# B008: FastAPI's Form(...)/File(None) in argument defaults is the framework's own
# dependency-injection idiom, not the mutable-default-argument bug this rule targets.
ignore = ["B008"]
